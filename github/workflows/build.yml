name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack SonicForge.zip
        run: unzip -q SonicForge.zip && ls SonicForge
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install Android SDK packages (the runner already ships the SDK)
        run: |
          SDKM=$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;26.1.10909125"
      - uses: gradle/actions/setup-gradle@v3
        with: { gradle-version: 8.7, cache-disabled: true }
      - name: Fetch emulator core (build time only)
        working-directory: SonicForge
        run: bash fetch_core.sh
      - name: Fetch Ruffle for Flash support (optional)
        working-directory: SonicForge
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash fetch_extras.sh
      - name: Build
        working-directory: SonicForge
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Show errors on the run summary page
        if: failure()
        working-directory: SonicForge
        run: |
          {
            echo '### Build errors'
            echo '```'
            grep -E '^e: |error:|What went wrong|Execution failed|FAILURE' -A2 build.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: SonicForge/build.log
          if-no-files-found: ignore
      - name: Write the build report (a .txt that goes next to the APKs)
        if: always()
        working-directory: SonicForge
        run: |
          D=app/build/outputs/apk/debug; mkdir -p "$D"
          VER=$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          {
            echo "SonicForge build report"
            echo "Version: $VER"
            echo "Date (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')"
            echo "Commit: ${GITHUB_SHA}   Run: ${GITHUB_RUN_ID}"
            echo
            echo "== APK files =="
            ls -la "$D"/*.apk 2>/dev/null || echo "NO APK WAS BUILT (the build failed, see the errors below)"
            echo
            echo "== Which APK to install =="
            echo "arm64-v8a  : almost every phone and tablet from about 2017 on (try this first)"
            echo "armeabi-v7a: older 32-bit phones and some cheap TV boxes / TV sticks"
            echo "universal  : contains both, bigger, use it when unsure"
            echo "Android TV : the launcher icon also appears on Android TV / Fire TV (leanback). Remote D-pad and gamepad drive the launcher, see TV notes in the app."
            echo "x86_64   : Chromebooks, Windows Subsystem for Android, PC emulators (BlueStacks, Android Studio AVD), some TV boxes"
            echo "x86       : old 32-bit PC emulators only"
            echo
            echo "== Emulator cores packed into this build =="
            ls -la app/src/main/jniLibs/*/ 2>/dev/null || echo "none"
            echo
            echo "== Ruffle (Flash) =="
            ls app/src/main/assets/ruffle 2>/dev/null | head -20
            echo
            echo "== Compile errors (every 'e:' line, unique) =="
            if [ -f build.log ] && grep -qE '^e: ' build.log; then grep -E '^e: ' build.log | sed 's#file://.*/SonicForge/app/src/main/java/##' | sort -u; else echo "none"; fi
            echo
            echo "== Warnings: $(grep -c '^w: ' build.log 2>/dev/null || echo 0) (not shown) =="
            echo
            echo "== Last 40 lines of the build log =="
            tail -40 build.log 2>/dev/null
          } > "$D/BUILD_REPORT.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SonicForge-APK
          path: |
            SonicForge/app/build/outputs/apk/debug/*.apk
            SonicForge/app/build/outputs/apk/debug/BUILD_REPORT.txt
          if-no-files-found: ignore
